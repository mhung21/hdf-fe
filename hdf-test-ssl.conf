server {
    listen 80;
    listen [::]:80;
    server_name quanly-dev.hdfinanceco.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quanly-dev.hdfinanceco.vn;

    ssl_certificate /etc/nginx/ssl/quanly-dev.crt;
    ssl_certificate_key /etc/nginx/ssl/quanly-dev.key;

    root /var/www/hdf-fe-test;
    index index.html;

    client_max_body_size 25M;

    # ===== Identity Test =====
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8884;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    # ===== API Test =====
    location /api/ {
        proxy_pass http://127.0.0.1:8883;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    # ===== Angular static files =====
    location / {
        try_files $uri $uri/ /index.html;
    }
}
