<form [formGroup]="form" (ngSubmit)="save()" class="space-y-5 p-1">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label tuiLabel>Mã sản phẩm <span class="text-red-500">*</span></label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input tuiTextfield formControlName="productCode" placeholder="VD: SP_6T_3PERCENT" />
      </tui-textfield>
    </div>
    <div>
      <label tuiLabel>Tên sản phẩm <span class="text-red-500">*</span></label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input tuiTextfield formControlName="productName" placeholder="VD: 6 tháng lãi 3%" />
      </tui-textfield>
    </div>
    <div class="md:col-span-2">
      <label tuiLabel>Mô tả</label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input tuiTextfield formControlName="description" placeholder="Mô tả sản phẩm..." />
      </tui-textfield>
    </div>
    <div>
      <label tuiLabel>Lãi suất (%/tháng) <span class="text-red-500">*</span></label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input
          tuiInputNumber
          [tuiNumberFormat]="numberFormat"
          [postfix]="' %'"
          formControlName="interestRateMonthly"
          placeholder="VD: 3"
        />
      </tui-textfield>
    </div>
    <div>
      <label tuiLabel>Phí Phần mềm (%/tháng)</label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input
          tuiInputNumber
          [tuiNumberFormat]="numberFormat"
          [postfix]="' %'"
          formControlName="qlkvRateMonthly"
          placeholder="0"
        />
      </tui-textfield>
    </div>
    <div>
      <label tuiLabel>Phí Thuê (%/tháng)</label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input
          tuiInputNumber
          [tuiNumberFormat]="numberFormat"
          [postfix]="' %'"
          formControlName="qltsRateMonthly"
          placeholder="0"
        />
      </tui-textfield>
    </div>
    <div>
      <label tuiLabel>Phí cố định/tháng (VNĐ)</label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input
          tuiInputNumber
          [tuiNumberFormat]="numberFormat"
          [postfix]="' VNĐ' | tuiCurrency"
          formControlName="fixedMonthlyFeeAmount"
          placeholder="0"
        />
      </tui-textfield>
    </div>
    <div>
      <label tuiLabel>Số tiền tối thiểu (VNĐ)</label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input
          tuiInputNumber
          [tuiNumberFormat]="numberFormat"
          [postfix]="' VNĐ' | tuiCurrency"
          formControlName="minPrincipalAmount"
          placeholder="0"
        />
      </tui-textfield>
    </div>
    <div>
      <label tuiLabel>Số tiền tối đa (VNĐ)</label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input
          tuiInputNumber
          [tuiNumberFormat]="numberFormat"
          [postfix]="' VNĐ' | tuiCurrency"
          formControlName="maxPrincipalAmount"
          placeholder="0"
        />
      </tui-textfield>
    </div>
    <div>
      <label tuiLabel>Kỳ hạn tối thiểu (tháng)</label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input tuiInputNumber formControlName="minTermMonths" placeholder="1" />
      </tui-textfield>
    </div>
    <div>
      <label tuiLabel>Kỳ hạn tối đa (tháng)</label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input tuiInputNumber formControlName="maxTermMonths" placeholder="36" />
      </tui-textfield>
    </div>
    <div>
      <label tuiLabel>Phí hồ sơ mặc định (% trên tổng tiền)</label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input
          tuiInputNumber
          [tuiNumberFormat]="numberFormat"
          [postfix]="' %'"
          formControlName="defaultFileFeeAmount"
          placeholder="0"
        />
      </tui-textfield>
    </div>
    <div>
      <label tuiLabel>Tỷ lệ bảo hiểm mặc định (%)</label>
      <tui-textfield [tuiTextfieldSize]="'m'">
        <input
          tuiInputNumber
          [tuiNumberFormat]="numberFormat"
          [postfix]="' %'"
          formControlName="defaultInsuranceRate"
          placeholder="0"
        />
      </tui-textfield>
    </div>
    <div class="flex items-center gap-3">
      <input tuiCheckbox type="checkbox" formControlName="isActive" />
      <label tuiLabel>Đang hoạt động</label>
    </div>
  </div>
  <div class="flex justify-end gap-3 pt-2">
    <button
      tuiButton
      type="button"
      appearance="outline"
      size="m"
      (click)="context.$implicit.complete()"
    >
      Hủy
    </button>
    <button tuiButton type="submit" appearance="primary" size="m" [disabled]="saving()">
      @if (saving()) {
        <tui-icon icon="@tui.loader-2" class="mr-1 animate-spin" />
      }
      {{ editingProduct() ? 'Cập Nhật' : 'Thêm Mới' }}
    </button>
  </div>
</form>
